name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm test --workspace @avogadro/api
      - run: npm run test --workspace @avogadro/runner --if-present
      - run: npm run build

  worker-redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test --workspace @avogadro/worker

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: avogadro
          POSTGRES_USER: avogadro
          POSTGRES_PASSWORD: avogadro-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avogadro -d avogadro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://avogadro:avogadro-local-only@localhost:5432/avogadro
      PGPASSWORD: avogadro-local-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create the least-privilege worker role
        run: psql -h localhost -U avogadro -d avogadro -v ON_ERROR_STOP=1 -f infra/postgres/worker-role.sql
      - name: Apply all Drizzle migrations to disposable PostgreSQL
        run: npm run db:migrate --workspace @avogadro/db
      - name: Assert worker grants and role attributes
        run: psql -h localhost -U avogadro -d avogadro -v ON_ERROR_STOP=1 -f infra/postgres/verify-worker-grants.sql

  foundry-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - uses: arr4n/setup-solc@v0.3.0
        with:
          version: 0.8.26
      - run: SOLC_BINARY="$(command -v solc)" bash infra/qa/run-foundry-fixture.sh
      - run: npm ci
      - run: AVOGADRO_FORGE_BIN="$(command -v forge)" AVOGADRO_SOLC_BIN="$(command -v solc)" npm run test:integration --workspace @avogadro/runner

  campaign-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: avogadro
          POSTGRES_USER: avogadro
          POSTGRES_PASSWORD: avogadro-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avogadro -d avogadro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: quay.io/minio/minio:RELEASE.2025-02-07T23-21-09Z
        env:
          MINIO_ROOT_USER: avogadro-ci-root
          MINIO_ROOT_PASSWORD: avogadro-ci-root-password
        ports:
          - 9000:9000
    env:
      DATABASE_URL: postgres://avogadro:avogadro-local-only@localhost:5432/avogadro
      PGPASSWORD: avogadro-local-only
      E2E_DATABASE_URL: postgres://avogadro:avogadro-local-only@localhost:5432/avogadro
      E2E_WORKER_DATABASE_URL: postgres://avogadro_worker:avogadro-worker-local-only@localhost:5432/avogadro
      E2E_REDIS_HOST: 127.0.0.1
      E2E_ARTIFACT_ENDPOINT: http://127.0.0.1:9000
      E2E_ARTIFACT_BUCKET: avogadro-ci
      E2E_ARTIFACT_REGION: us-east-1
      E2E_ARTIFACT_API_ACCESS_KEY_ID: avogadro-ci-api
      E2E_ARTIFACT_API_SECRET_ACCESS_KEY: avogadro-ci-api-secret
      E2E_ARTIFACT_WORKER_ACCESS_KEY_ID: avogadro-ci-worker
      E2E_ARTIFACT_WORKER_SECRET_ACCESS_KEY: avogadro-ci-worker-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - uses: arr4n/setup-solc@v0.3.0
        with:
          version: 0.8.26
      - run: npm ci
      - name: Create the least-privilege worker role
        run: psql -h localhost -U avogadro -d avogadro -v ON_ERROR_STOP=1 -f infra/postgres/worker-role.sql
      - name: Apply all Drizzle migrations
        run: npm run db:migrate --workspace @avogadro/db
      - name: Verify worker database grants
        run: psql -h localhost -U avogadro -d avogadro -v ON_ERROR_STOP=1 -f infra/postgres/verify-worker-grants.sql
      - name: Provision private bucket and scoped API/worker identities
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then echo "MinIO did not become ready" >&2; exit 1; fi
            sleep 2
          done
          cat > /tmp/avogadro-api-policy.json <<'POLICY'
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::avogadro-ci/campaigns/*"]}]}
          POLICY
          cat > /tmp/avogadro-worker-policy.json <<'POLICY'
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::avogadro-ci/campaigns/*"]}]}
          POLICY
          mkdir -p /tmp/avogadro-mc
          mc() { docker run --rm --network host -e MC_CONFIG_DIR=/mc -v /tmp/avogadro-mc:/mc -v /tmp:/policies --entrypoint mc quay.io/minio/mc:RELEASE.2025-02-21T16-00-46Z "$@"; }
          mc alias set ci http://127.0.0.1:9000 avogadro-ci-root avogadro-ci-root-password >/dev/null
          mc mb --ignore-existing ci/avogadro-ci >/dev/null
          mc admin policy create ci avogadro-api /policies/avogadro-api-policy.json >/dev/null
          mc admin policy create ci avogadro-worker /policies/avogadro-worker-policy.json >/dev/null
          mc admin user add ci avogadro-ci-api avogadro-ci-api-secret >/dev/null
          mc admin policy attach ci avogadro-api --user avogadro-ci-api >/dev/null
          mc admin user add ci avogadro-ci-worker avogadro-ci-worker-secret >/dev/null
          mc admin policy attach ci avogadro-worker --user avogadro-ci-worker >/dev/null
          mc ilm rule add --expire-days 30 --prefix campaigns/ ci/avogadro-ci >/dev/null
      - name: Run authenticated campaign acceptance test
        run: AVOGADRO_FORGE_BIN="$(command -v forge)" AVOGADRO_SOLC_BIN="$(command -v solc)" node --import tsx --test tests/campaign-e2e.test.ts
