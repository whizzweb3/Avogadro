name: avogadro

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: avogadro
      POSTGRES_USER: avogadro
      POSTGRES_PASSWORD: avogadro-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/worker-role.sql:/docker-entrypoint-initdb.d/90-worker-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avogadro -d avogadro"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend, worker-isolated]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend, worker-isolated]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: avogadro-local
      MINIO_ROOT_PASSWORD: local-minio-password-change-me
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks: [backend, worker-isolated]

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-02-21T16-00-46Z
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null &&
      until mc ready local; do sleep 2; done &&
      mc mb --ignore-existing local/avogadro-local >/dev/null &&
      mc admin policy create local avogadro-api /policies/api-policy.json >/dev/null &&
      mc admin policy create local avogadro-worker /policies/worker-policy.json >/dev/null &&
      mc admin user add local avogadro-api "$${ARTIFACT_API_SECRET_ACCESS_KEY}" >/dev/null &&
      mc admin policy attach local avogadro-api --user avogadro-api >/dev/null &&
      mc admin user add local avogadro-worker "$${ARTIFACT_WORKER_SECRET_ACCESS_KEY}" >/dev/null &&
      mc admin policy attach local avogadro-worker --user avogadro-worker >/dev/null &&
      mc ilm rule add --expire-days 30 --prefix campaigns/ local/avogadro-local
    environment:
      MINIO_ROOT_USER: avogadro-local
      MINIO_ROOT_PASSWORD: local-minio-password-change-me
      ARTIFACT_API_SECRET_ACCESS_KEY: local-api-artifact-password-change-me
      ARTIFACT_WORKER_SECRET_ACCESS_KEY: local-worker-artifact-password-change-me
    volumes:
      - ./infra/minio:/policies:ro
    depends_on:
      minio:
        condition: service_started
    networks: [backend]

  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DATABASE_URL: postgres://avogadro_worker:avogadro-worker-local-only@postgres:5432/avogadro
      WORKER_CONCURRENCY: "1"
      ARTIFACT_ENDPOINT: http://minio:9000
      ARTIFACT_REGION: us-east-1
      ARTIFACT_BUCKET: avogadro-local
      ARTIFACT_ACCESS_KEY_ID: avogadro-worker
      ARTIFACT_SECRET_ACCESS_KEY: local-worker-artifact-password-change-me
      ARTIFACT_RETENTION_DAYS: "30"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 96
    cpus: 1.0
    mem_limit: 1g
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    networks: [worker-isolated]
    restart: unless-stopped

networks:
  backend:
    driver: bridge
  worker-isolated:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  minio-data:
