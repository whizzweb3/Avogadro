name: avogadro

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: avogadro
      POSTGRES_USER: avogadro
      POSTGRES_PASSWORD: avogadro-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/worker-role.sql:/docker-entrypoint-initdb.d/90-worker-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avogadro -d avogadro"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend, worker-isolated]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend, worker-isolated]

  s3mock:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: avogadro-local
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - s3mock-data:/s3mockroot
    networks: [backend, worker-isolated]

  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DATABASE_URL: postgres://avogadro_worker:avogadro-worker-local-only@postgres:5432/avogadro
      WORKER_CONCURRENCY: "1"
      ARTIFACT_ENDPOINT: http://s3mock:9090
      ARTIFACT_REGION: us-east-1
      ARTIFACT_BUCKET: avogadro-local
      ARTIFACT_ACCESS_KEY_ID: avogadro-worker
      ARTIFACT_SECRET_ACCESS_KEY: local-worker-artifact-password-change-me
      ARTIFACT_RETENTION_DAYS: "30"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      s3mock:
        condition: service_started
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 96
    cpus: 1.0
    mem_limit: 1g
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    networks: [worker-isolated]
    restart: unless-stopped

networks:
  backend:
    driver: bridge
  worker-isolated:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  s3mock-data:
